<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Playroom</title>
    <meta
      name="description"
      content="Playroom is a cozy shelf of small web games for young children to play alone or with a grown-up."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff1d6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a2245" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <h1 class="logo"><span class="logo-mark" aria-hidden="true">🧸</span> Playroom</h1>
      <div id="corner" class="topbar-end corner"></div>
    </header>

    <nav id="players" class="players"></nav>

    <main id="games" class="games"></main>

    <dialog id="grownups" class="sheet"></dialog>

    <footer class="credits">
      <span data-word="creditVoice">Slovenian voice:</span>
      <a href="https://huggingface.co/rhasspy/piper-voices/tree/main/sl/sl_SI/artur/medium">Piper “Artur”</a>,
      <span data-word="creditDataset">dataset by</span>
      <a href="https://huggingface.co/datasets/ppisljar/artur_studio_tts/">ppisljar</a>,
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
